name: Deploy
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
      - 'gh-pages'
permissions:
  contents: read
  pages: write
  id-token: write
env:
  BRANCH_NAME: ${{ github.ref_name }}
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install requirements
        run: pip install properdocs properdocs-theme-mkdocs mkdocs-material mike
      - name: Setup Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Deploy version with mike
        run: |
          git pull
          mike deploy --push $BRANCH_NAME
